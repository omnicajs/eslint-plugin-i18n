name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-publish-auth:
    name: Detect publish auth
    runs-on: ubuntu-24.04

    outputs:
      has-npm-token: ${{ steps.detect.outputs.has-npm-token }}

    steps:
      - name: Detect npm token
        id: detect
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "has-npm-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-npm-token=false" >> "$GITHUB_OUTPUT"
          fi

  release-checks:
    name: Release checks
    runs-on: ubuntu-24.04

    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24.x
          cache-key-suffix: release
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Run checks
        run: |
          npm run lint
          npm run test:coverage

      - name: Download baseline release coverage summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .coverage-baseline
          RUN_ID="$(gh run list --workflow release.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"

          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name coverage-summary --dir .coverage-baseline || true
          fi

      - name: Report release coverage
        run: npm run coverage:report -- --baseline .coverage-baseline/coverage-summary.json --title "Release coverage"

      - name: Upload coverage summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 90

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 90

  publish-token:
    name: Publish to npm with token
    runs-on: ubuntu-24.04
    needs: [detect-publish-auth, release-checks]
    if: ${{ needs.detect-publish-auth.outputs.has-npm-token == 'true' }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24.x
          cache-key-suffix: release-publish-token
          registry-url: https://registry.npmjs.org

      - name: Build package
        run: npm run build

      - name: Publish to npm with token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  publish-trusted:
    name: Publish to npm with trusted publishing
    runs-on: ubuntu-24.04
    needs: [detect-publish-auth, release-checks]
    if: ${{ needs.detect-publish-auth.outputs.has-npm-token == 'false' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24.x
          cache-key-suffix: release-publish-trusted
          registry-url: https://registry.npmjs.org

      - name: Build package
        run: npm run build

      - name: Publish to npm with trusted publishing
        run: npm publish --access public

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [publish-token, publish-trusted]
    if: ${{ always() && (needs.publish-token.result == 'success' || needs.publish-trusted.result == 'success') }}

    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
