name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      prerelease:
        description: Prerelease channel
        required: true
        default: none
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
      npm_tag:
        description: npm dist-tag for publication
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-publish-auth:
    name: Detect publish auth
    runs-on: ubuntu-24.04

    outputs:
      has-npm-token: ${{ steps.detect.outputs.has-npm-token }}

    steps:
      - name: Detect npm token
        id: detect
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "has-npm-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-npm-token=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Prepare release
    runs-on: ubuntu-24.04

    permissions:
      actions: read
      contents: write

    outputs:
      release_tag: ${{ steps.release-meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release branch and npm tag
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          if [ "$NPM_TAG" = "latest" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release to npm tag 'latest' must be started from the main branch."
            exit 1
          fi

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24.x
          cache-key-suffix: release
          registry-url: https://registry.npmjs.org

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run checks
        run: |
          npm run lint
          npm run test:coverage

      - name: Download baseline release coverage summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .coverage-baseline
          RUN_ID="$(gh run list --workflow release.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"

          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name coverage-summary --dir .coverage-baseline || true
          fi

      - name: Report release coverage
        run: npm run coverage:report -- --baseline .coverage-baseline/coverage-summary.json --title "Release coverage"

      - name: Upload coverage summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 90
          overwrite: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 90
          overwrite: true

      - name: Resolve version bump
        id: version-bump
        env:
          RELEASE_TYPE: ${{ inputs.release }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          case "$RELEASE_TYPE:$PRERELEASE" in
            auto:none)
              VERSION_BUMP="patch"
              ;;
            patch:none|minor:none|major:none)
              VERSION_BUMP="$RELEASE_TYPE"
              ;;
            auto:alpha|auto:beta|auto:rc)
              VERSION_BUMP="prerelease --preid $PRERELEASE"
              ;;
            patch:alpha|patch:beta|patch:rc)
              VERSION_BUMP="prepatch --preid $PRERELEASE"
              ;;
            minor:alpha|minor:beta|minor:rc)
              VERSION_BUMP="preminor --preid $PRERELEASE"
              ;;
            major:alpha|major:beta|major:rc)
              VERSION_BUMP="premajor --preid $PRERELEASE"
              ;;
            *)
              echo "Unsupported release/prerelease combination: $RELEASE_TYPE/$PRERELEASE"
              exit 1
              ;;
          esac

          echo "value=$VERSION_BUMP" >> "$GITHUB_OUTPUT"

      - name: Create release commit and tag
        id: release-meta
        env:
          VERSION_BUMP: ${{ steps.version-bump.outputs.value }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC2206
          VERSION_ARGS=($VERSION_BUMP)
          npm version "${VERSION_ARGS[@]}" --no-git-tag-version

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; reusing it for release rerun."
            echo "created=false" >> "$GITHUB_OUTPUT"
            git reset --hard
            exit 0
          fi

          git add package.json package-lock.json
          git commit -m "chore(release): ${tag}"
          git tag "${tag}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tags
        if: ${{ steps.release-meta.outputs.created == 'true' }}
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/${{ steps.release-meta.outputs.tag }}"

  publish-token:
    name: Publish to npm with token
    runs-on: ubuntu-24.04
    needs: [detect-publish-auth, release]
    if: ${{ needs.detect-publish-auth.outputs.has-npm-token == 'true' }}

    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.release.outputs.release_tag }}

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24.x
          cache-key-suffix: release-publish-token
          registry-url: https://registry.npmjs.org

      - name: Build package
        run: npm run build

      - name: Check npm package version
        id: npm-version
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --silent >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with token
        if: ${{ steps.npm-version.outputs.published == 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: npm publish --access public --tag "$NPM_TAG"

  publish-trusted:
    name: Publish to npm with trusted publishing
    runs-on: ubuntu-24.04
    needs: [detect-publish-auth, release]
    if: ${{ needs.detect-publish-auth.outputs.has-npm-token == 'false' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.release.outputs.release_tag }}

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24.x
          cache-key-suffix: release-publish-trusted
          registry-url: https://registry.npmjs.org

      - name: Build package
        run: npm run build

      - name: Check npm package version
        id: npm-version
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --silent >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with trusted publishing
        if: ${{ steps.npm-version.outputs.published == 'false' }}
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: npm publish --access public --tag "$NPM_TAG"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [release, publish-token, publish-trusted]
    if: ${{ always() && (needs.publish-token.result == 'success' || needs.publish-trusted.result == 'success') }}

    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.release_tag }}
          generate_release_notes: true
